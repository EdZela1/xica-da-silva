name: Publicar Mundo Virtual V1 en GitHub Pages
on:
  push:
    branches:
      - mundo-virtual-v1
    paths:
      - 'mundo-virtual-v1/**'
      - '.github/workflows/mundo-virtual-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "mundo-virtual-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mundo-virtual-v1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
